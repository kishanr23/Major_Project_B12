<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrailGuard — Operations Dashboard</title>
  <meta name="description" content="Real-time TrailGuard hiker tracking dashboard for trail operators." />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    /* ── Design tokens ──────────────────────────────────────────────────────── */
    :root {
      --bg:         #0b0f1a;
      --surface:    #131929;
      --border:     #1e2d4a;
      --accent:     #1e64dc;
      --sos:        #e63946;
      --sos-bg:     rgba(230,57,70,0.12);
      --teal:       #2ec4b6;
      --teal-bg:    rgba(46,196,182,0.1);
      --text:       #c8d8f0;
      --muted:      #4a6080;
      --new-device: #f4a261;
      --delivered:  #3dd68c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 1000;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    header h1 span { color: var(--teal); }

    #connection-status {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #connection-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    #connection-dot.connected { background: var(--delivered); }

    /* ── SOS alert banner ────────────────────────────────────────────────────── */
    #sos-banner {
      display: none;
      background: var(--sos-bg);
      border-bottom: 2px solid var(--sos);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--sos);
      flex-shrink: 0;
      animation: pulse 1s ease-in-out infinite alternate;
    }

    /* ── Security alert banner ───────────────────────────────────────────────── */
    #security-banner {
      display: none;
      background: rgba(244,162,97,0.15);
      border-bottom: 2px solid var(--new-device);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--new-device);
      flex-shrink: 0;
    }
    #security-banner.escalated {
      background: var(--sos-bg);
      border-bottom: 2px solid var(--sos);
      color: var(--sos);
      animation: pulse 1s ease-in-out infinite alternate;
    }

    @keyframes pulse { from { opacity:1; } to { opacity:0.6; } }

    #sos-banner.visible { display: flex; align-items: center; gap: 10px; }
    #security-banner.visible { display: flex; align-items: center; gap: 10px; }

    /* ── Layout ──────────────────────────────────────────────────────────────── */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Map ─────────────────────────────────────────────────────────────────── */
    #map {
      flex: 1;
      background: #0d1120;
    }

    /* ── Sidebar ─────────────────────────────────────────────────────────────── */
    .sidebar {
      width: 340px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #event-list {
      overflow-y: auto;
      flex: 1;
    }

    .event-card {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .event-card:hover { background: #1a2238; }

    .event-card.sos-card { background: var(--sos-bg); border-left: 3px solid var(--sos); }
    .event-card.teal-card { border-left: 3px solid var(--teal); }
    .event-card.new-device { border-left: 3px solid var(--new-device); }

    .event-type {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .event-type.sos  { color: var(--sos); }
    .event-type.teal { color: var(--teal); }
    .event-type.new  { color: var(--new-device); }

    .event-hiker { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 2px; }
    .event-node  { font-size: 12px; color: var(--muted); }
    .event-time  { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .event-msg   { font-size: 12px; color: #8899bb; margin-top: 4px; font-style: italic; }

    .new-device-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(244,162,97,0.15);
      border: 1px solid var(--new-device);
      color: var(--new-device);
      font-size: 10px;
      font-weight: 700;
    }

    /* ── Leaflet overrides ───────────────────────────────────────────────────── */
    .leaflet-container { background: #0d1120 !important; }
    .sos-icon  { background: var(--sos);  border-radius: 50%; border: 2px solid #fff; }
    .teal-icon { background: var(--teal); border-radius: 50%; border: 2px solid #fff; }
  </style>
</head>
<body>

<header>
  <h1>Trail<span>Guard</span> Operations Dashboard</h1>
  <div id="connection-status">
    <div id="connection-dot"></div>
    <span id="connection-label">Connecting…</span>
  </div>
</header>

<div id="sos-banner" role="alert" aria-live="assertive">
  🚨 <span id="sos-banner-text">ACTIVE SOS ALERT</span>
</div>

<div id="security-banner" role="alert" aria-live="assertive">
  🛡️ <span id="security-banner-text">SECURITY ALERT</span>
</div>

<div class="main-layout">
  <div id="map"></div>
  <aside class="sidebar" aria-label="Event feed">
    <div class="sidebar-header">Live Event Feed</div>
    <div id="event-list"></div>
  </aside>
</div>

<script>
// ── Map init ─────────────────────────────────────────────────────────────────
const map = L.map('map').setView([0, 0], 3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

const markers = {};

function makeIcon(type) {
  return L.divIcon({
    className: type === 'SOS' ? 'sos-icon' : 'teal-icon',
    iconSize: [14, 14],
  });
}

function placeMarker(msg) {
  if (!msg.hiker_lat || !msg.hiker_lon) return;
  const key = `${msg.hiker_id}_${msg.node_id}`;
  if (markers[key]) map.removeLayer(markers[key]);
  const m = L.marker([msg.hiker_lat, msg.hiker_lon], { icon: makeIcon(msg.msg_type) })
    .bindPopup(`<b>${msg.msg_type}</b><br>${msg.hiker_id}<br>${msg.node_id}`)
    .addTo(map);
  markers[key] = m;
  if (msg.msg_type === 'SOS') map.panTo([msg.hiker_lat, msg.hiker_lon]);
}

// ── Event feed ────────────────────────────────────────────────────────────────
function formatTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString();
}

function prependCard(msg) {
  const isSos = msg.msg_type === 'SOS';
  const isNew = msg.is_new_device;

  const card = document.createElement('div');
  card.className = `event-card ${isSos ? 'sos-card' : 'teal-card'} ${isNew ? 'new-device' : ''}`;

  card.innerHTML = `
    <div class="event-type ${isSos ? 'sos' : 'teal'}">${msg.msg_type}</div>
    <div class="event-hiker">${msg.hiker_id}</div>
    <div class="event-node">via ${msg.node_id}</div>
    <div class="event-time">${formatTime(msg.timestamp)}</div>
    ${msg.free_text ? `<div class="event-msg">"${msg.free_text}"</div>` : ''}
    ${msg.message   ? `<div class="event-msg">"${msg.message}"</div>` : ''}
    ${isNew ? `<span class="new-device-badge">⚠ NEW DEVICE — verify with operator</span>` : ''}
  `;

  const list = document.getElementById('event-list');
  list.insertBefore(card, list.firstChild);
}

// ── SOS banner ────────────────────────────────────────────────────────────────
let sosBannerCount = 0;

function showSosBanner(msg) {
  sosBannerCount++;
  const banner = document.getElementById('sos-banner');
  const text   = document.getElementById('sos-banner-text');
  text.textContent = `ACTIVE SOS — Hiker: ${msg.hiker_id} | Node: ${msg.node_id}`;
  banner.classList.add('visible');
}

function showSecurityAlert(data, escalated = false) {
  const banner = document.getElementById('security-banner');
  const text   = document.getElementById('security-banner-text');
  
  if (escalated) {
    banner.classList.add('escalated');
    text.textContent = `CRITICAL: ${data.type} — ${data.message}`;
  } else {
    banner.classList.remove('escalated');
    text.textContent = `WARNING: ${data.message} (Hiker: ${data.hiker_id})`;
  }
  
  banner.classList.add('visible');
  
  // Auto-hide after 10s if not escalated
  if (!escalated) {
    setTimeout(() => { banner.classList.remove('visible'); }, 10000);
  }
}

// ── Socket.IO ────────────────────────────────────────────────────────────────
const socket = io();

socket.on('connect', () => {
  document.getElementById('connection-dot').classList.add('connected');
  document.getElementById('connection-label').textContent = 'Live';
});

socket.on('disconnect', () => {
  document.getElementById('connection-dot').classList.remove('connected');
  document.getElementById('connection-label').textContent = 'Disconnected';
});

socket.on('new_message', (msg) => {
  prependCard(msg);
  placeMarker(msg);
  if (msg.msg_type === 'SOS') showSosBanner(msg);
});

socket.on('new_device_alert', (data) => {
  console.warn('[TOFU] New device seen:', data.hiker_id);
});

socket.on('security_alert', (data) => {
  console.warn('[SECURITY]', data);
  showSecurityAlert(data, false);
});

socket.on('security_escalation', (data) => {
  console.error('[SECURITY ESCALATION]', data);
  showSecurityAlert(data, true);
});

// ── Load historical messages on page load ────────────────────────────────────
fetch('/api/messages')
  .then(r => r.json())
  .then(msgs => msgs.reverse().forEach(m => {
    const enriched = { ...m, ...JSON.parse(m.payload_json || '{}') };
    prependCard(enriched);
    placeMarker(enriched);
    if (enriched.msg_type === 'SOS') showSosBanner(enriched);
  }));
</script>
</body>
</html>
